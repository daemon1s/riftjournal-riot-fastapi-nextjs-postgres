services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: evelynndb
      POSTGRES_USER: evelynnuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evelynnuser -d evelynndb"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    image: rift-backend:local
    restart: always
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - RIOT_REGION=${RIOT_REGION:-americas}
      - RIOT_PLATFORM=${RIOT_PLATFORM:-la1}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.riftjournal.daemonize.me
    image: rift-frontend:local
    restart: always
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.riftjournal.daemonize.me
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres_data:
